name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: the offline suite with randomized Hypothesis examples, and the
  # staging suite, so drift in dependencies or in the Hub is seen without a
  # push.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  # Pushes and pull requests run the derandomized Hypothesis profile (the same
  # examples every time); the weekly run draws new examples.
  HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'random' || 'polars-hf' }}
  # The weekly run also runs the offline tests marked "slow".
  OFFLINE_TESTS: ${{ github.event_name == 'schedule' && 'not staging' || 'not staging and not slow' }}

jobs:
  # Lint + offline tests with the committed lock. No network access to the Hub:
  # the tests run against the local fake in tests/fakehub.py.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer run for the same ref supersedes the older one.
    concurrency:
      group: ci-test-${{ github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q -m "$OFFLINE_TESTS"

  # Offline tests against the edges of the supported dependency range. These
  # jobs resolve without the lock, so they install with `uv pip` and run with
  # `--no-sync` (a plain `uv run` would re-sync the environment back to the
  # lock).
  dependencies:
    name: deps (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-deps-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    # Only the pre-release job may fail: it tracks an unreleased Polars.
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lowest version of each direct dependency (polars 1.40.0,
          # huggingface_hub 1.12.0) on the lowest supported Python. Dev
          # tools stay current.
          - name: lowest-direct
            python-version: "3.10"
            install: uv pip install --resolution lowest-direct -e .
            allow-failure: false
          - name: latest
            python-version: "3.12"
            install: uv pip install --upgrade -e .
            allow-failure: false
          # The newest Polars 2 pre-release (or release, once there is one).
          # A specifier that names a pre-release makes uv accept pre-releases
          # for polars only.
          - name: polars-prerelease
            python-version: "3.12"
            install: uv pip install -e . "polars>=2.0.0rc1"
            allow-failure: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv venv
      # Dev tools first, the dependency pins last: the last install decides
      # the versions under test, and a later step cannot move them.
      - run: uv pip install --group dev
      - run: ${{ matrix.install }}
      # Make the versions under test visible in the log.
      - run: uv pip list | grep -Ei 'polars|huggingface|httpx|hf-xet'
      - run: uv run --no-sync pytest -q -m "$OFFLINE_TESTS"

  # Live round-trips against the Hub CI staging instance, on every push and
  # pull request and in the weekly run. Each test creates its own uniquely
  # named bucket and deletes it, so runs cannot race. The token below is the
  # public token of the staging CI user (the one huggingface_hub's own test
  # suite uses); it is not a secret and is not valid on huggingface.co.
  # tests/conftest.py forces the same endpoint and token, and reruns staging
  # tests on HTTP 409/502/503/504 and timeouts.
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never cancelled: a cancelled run skips the fixture teardown and leaves
    # its buckets on staging. Runs for the same ref queue instead.
    concurrency:
      group: ci-staging-${{ github.ref }}
      cancel-in-progress: false
    env:
      HF_ENDPOINT: https://hub-ci.huggingface.co
      HF_TOKEN: hf_HubCITokenXXXXXXXXXXXXXXXXXXXXX
      # The weekly run also uploads a few hundred MB with both sink backends
      # (tests/test_staging_sinks.py::test_big_write_is_identical_with_both_backends).
      POLARS_HF_BIG_STAGING: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -q -m staging
