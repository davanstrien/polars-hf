name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint + offline tests with the committed lock. No network access to the Hub:
  # the tests run against the local fake in tests/fakehub.py.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q -m "not staging"

  # Offline tests against the edges of the supported dependency range, on one
  # Python. These jobs resolve without the lock, so they install with
  # `uv pip` and run with `--no-sync` (a plain `uv run` would re-sync the
  # environment back to the lock).
  dependencies:
    name: deps (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Only the release-candidate job may fail: it tracks an unreleased Polars.
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lowest version of each direct dependency (polars 1.40.0,
          # huggingface_hub 1.12.0, httpx 0.27.0). Dev tools stay current.
          - name: lowest-direct
            install: uv pip install --resolution lowest-direct -e .
            allow-failure: false
          - name: latest
            install: uv pip install --upgrade -e .
            allow-failure: false
          - name: polars-2.0-rc
            install: uv pip install -e . "polars==2.0.0rc2"
            allow-failure: true
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv venv
      - run: ${{ matrix.install }}
      - run: uv pip install --group dev
      - run: uv pip list
      - run: uv run --no-sync pytest -q -m "not staging"

  # Live round-trips against the Hub CI staging instance, on every push and
  # pull request. Each test creates its own uniquely named bucket and deletes
  # it, so runs cannot race. The token below is the public token of the
  # staging CI user (the one huggingface_hub's own test suite uses); it is not
  # a secret and is not valid on huggingface.co. tests/conftest.py forces the
  # same endpoint and token, and reruns staging tests on transient errors.
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_ENDPOINT: https://hub-ci.huggingface.co
      HF_TOKEN: hf_HubCITokenXXXXXXXXXXXXXXXXXXXXX
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -q -m staging
