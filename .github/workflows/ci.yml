name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q -m "not network"

  # Live round-trips against the fixture bucket. Runs on pushes to main only:
  # the tests write to a real bucket, so they don't run for PRs (and would
  # race each other across a matrix). Without an HF_TOKEN repo secret the
  # tests skip and the job stays green.
  network:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run pytest -q -m network
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
